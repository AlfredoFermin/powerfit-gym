<VirtualHost *:80>
    ServerName powerfit.local
    DocumentRoot /var/www/powerfit_gym/public

    <Directory /var/www/powerfit_gym/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/powerfit_error.log
    CustomLog ${APACHE_LOG_DIR}/powerfit_access.log combined
</VirtualHost>
